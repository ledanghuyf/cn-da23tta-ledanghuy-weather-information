<svg xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="cloud-fill" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dce9ef"/></linearGradient>
  <linearGradient id="sun-fill" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#ffd98a"/><stop offset="1" stop-color="#f4aa53"/></linearGradient>
  <linearGradient id="moon-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffedba"/><stop offset="1" stop-color="#d8d5ee"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#264b62" flood-opacity=".12"/></filter>
  <g id="sun-shape"><g stroke="#f3b45c" stroke-width="3" stroke-linecap="round"><path d="M80 20v9m0 102v9M20 80h9m102 0h9M38 38l7 7m70 70 7 7M38 122l7-7m70-70 7-7"/></g><circle cx="80" cy="80" r="39" fill="url(#sun-fill)"/><circle cx="69" cy="67" r="24" fill="#ffe5a8" opacity=".25"/></g>
  <path id="cloud-shape" d="M43 112c-15 0-27-10-27-24s11-25 25-25c5-20 20-31 39-28 17 2 28 13 31 28 18-2 33 8 33 25 0 14-12 24-28 24Z" fill="url(#cloud-fill)"/>
  <g id="rain-shape" stroke="#6b9fc5" stroke-width="5" stroke-linecap="round"><path d="m50 120-6 13m32-13-6 13m32-13-6 13"/></g>
  <g id="moon-shape"><path d="M105 35a50 50 0 1 0 22 78c-36 8-62-25-53-54 5-13 14-20 31-24Z" fill="url(#moon-fill)"/><path d="m123 36 3 9 9 3-9 3-3 9-3-9-9-3 9-3Z" fill="#ffe9ad"/><circle cx="145" cy="75" r="3" fill="#f6e5ba"/></g>
 </defs>
 <symbol id="clear" viewBox="0 0 160 160"><use href="#sun-shape"/></symbol>
 <symbol id="moon" viewBox="0 0 160 160"><use href="#moon-shape"/></symbol>
 <symbol id="partly-cloudy" viewBox="0 0 160 160"><g transform="translate(27,-20) scale(.72)"><use href="#sun-shape"/></g><g transform="translate(1,25) scale(.96)" filter="url(#shadow)"><use href="#cloud-shape"/></g></symbol>
 <symbol id="night-cloud" viewBox="0 0 160 160"><g transform="translate(38,-9) scale(.67)"><use href="#moon-shape"/></g><g transform="translate(0,27) scale(.95)" filter="url(#shadow)"><use href="#cloud-shape"/></g></symbol>
 <symbol id="cloudy" viewBox="0 0 160 160"><g transform="translate(42,8) scale(.69)" opacity=".65"><use href="#cloud-shape"/></g><g transform="translate(0,23)" filter="url(#shadow)"><use href="#cloud-shape"/></g></symbol>
 <symbol id="rain" viewBox="0 0 160 160"><g filter="url(#shadow)"><use href="#cloud-shape"/></g><use href="#rain-shape"/></symbol>
 <symbol id="night-rain" viewBox="0 0 160 160"><g transform="translate(38,-15) scale(.62)"><use href="#moon-shape"/></g><g transform="translate(0,8)"><use href="#cloud-shape"/><use href="#rain-shape"/></g></symbol>
 <symbol id="showers" viewBox="0 0 160 160"><g transform="translate(32,-22) scale(.65)"><use href="#sun-shape"/></g><g transform="translate(0,8)" filter="url(#shadow)"><use href="#cloud-shape"/></g><use href="#rain-shape" transform="translate(0,8)"/></symbol>
 <symbol id="storm" viewBox="0 0 160 160"><g filter="url(#shadow)"><use href="#cloud-shape"/></g><path d="m78 95-15 27h14l-6 24 29-35H84l8-16Z" fill="#efb765"/><path d="m44 119-5 13m79-13-5 13" stroke="#6b9fc5" stroke-width="4" stroke-linecap="round"/></symbol>
 <symbol id="snow" viewBox="0 0 160 160"><use href="#cloud-shape"/><g stroke="#7da8bd" stroke-width="2.5" stroke-linecap="round"><path d="M50 120v20m-9-15 18 10m-18 0 18-10M107 120v20m-9-15 18 10m-18 0 18-10"/></g></symbol>
 <symbol id="fog" viewBox="0 0 160 160"><use href="#cloud-shape" opacity=".85"/><g stroke="#8babb7" stroke-width="4" stroke-linecap="round"><path d="M28 110h98M40 123h98M25 136h82"/></g></symbol>
 <symbol id="unknown" viewBox="0 0 160 160"><circle cx="80" cy="80" r="50" fill="#e6eef1"/><path d="M64 62c0-22 34-22 34 0 0 13-18 13-18 28" fill="none" stroke="#63818c" stroke-width="8" stroke-linecap="round"/><circle cx="80" cy="108" r="5" fill="#63818c"/></symbol>
</svg>
